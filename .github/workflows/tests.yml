name: Tests

# Runs the PHPUnit suite and a syntax check across the PHP versions the plugin
# claims to support.
#
# Also callable from other workflows (`uses: ./.github/workflows/tests.yml`),
# which is how deploy-to-wordpress.yml gates the WordPress.org release on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 12 requires PHP 8.3+. The `lint` job below covers the older
        # versions the plugin still advertises support for.
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is what readme.txt advertises; 8.1 is what the support page
        # expects; 8.4 is current. See README.md for that inconsistency.
        php: ['7.4', '8.1', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check syntax of every shipped PHP file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Syntax error"
              php -l "$file" || true
              status=1
            fi
          done < <(find . -name '*.php' \
                        -not -path './vendor/*' \
                        -not -path './tests/*' \
                        -not -path './.git/*')
          exit $status
